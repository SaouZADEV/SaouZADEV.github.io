<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- ============================================================
       ดอกฝ้ายคำ (Cochlospermum religiosum) — Refined Curved Art
       3 versions: flower-full, flower-watermark, flower-icon
       Color palette: #D4AF37, #C89229, #E0C050, #002B5B
       ============================================================ -->

  <defs>
    <!-- Petal gradient: golden center fading to lighter edge -->
    <radialGradient id="petalGrad" cx="40%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#F5D562"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#C89229"/>
    </radialGradient>
    <radialGradient id="petalGrad2" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#E0C050"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8861B"/>
    </radialGradient>
    <radialGradient id="centerGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E85D04"/>
      <stop offset="70%" stop-color="#D43D04"/>
      <stop offset="100%" stop-color="#B82E04"/>
    </radialGradient>
    <radialGradient id="stamenGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5D562"/>
      <stop offset="100%" stop-color="#E0C050"/>
    </radialGradient>
    <!-- Subtle shadow filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5" result="blur"/>
      <feOffset dx="0" dy="1" result="shifted"/>
      <feFlood flood-color="#8B6914" flood-opacity="0.2"/>
      <feComposite in2="shifted" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ======================== VERSION 1: FULL COLOR ======================== -->
  <g id="flower-full" filter="url(#softShadow)">

    <!-- ===== PETAL LAYER 1 (Behind — slightly darker) ===== -->

    <!-- Petal 1: Top — wide rounded crinkled petal -->
    <path d="M100,88 C92,78 80,52 78,38 C76,24 86,10 100,10
             C114,10 124,24 122,38 C120,52 108,78 100,88Z"
          fill="#C89229" opacity="0.85"/>
    <!-- Petal 1: lighter overlay for depth -->
    <path d="M100,85 C94,76 84,54 83,40 C82,28 89,16 100,16
             C111,16 118,28 117,40 C116,54 106,76 100,85Z"
          fill="url(#petalGrad)"/>
    <!-- Petal 1: vein highlight -->
    <path d="M100,22 C100,22 98,50 100,80" stroke="#F5D562" stroke-width="0.6" fill="none" opacity="0.5"/>
    <path d="M92,30 C95,45 98,62 100,78" stroke="#F5D562" stroke-width="0.3" fill="none" opacity="0.3"/>
    <path d="M108,30 C105,45 102,62 100,78" stroke="#F5D562" stroke-width="0.3" fill="none" opacity="0.3"/>

    <!-- Petal 2: Top-Right -->
    <path d="M105,90 C112,82 136,64 148,56 C160,48 174,52 178,66
             C182,80 172,92 158,92 C144,92 116,88 105,90Z"
          fill="#C89229" opacity="0.85"/>
    <path d="M108,88 C114,82 136,66 148,60 C160,54 170,56 174,68
             C178,80 168,90 156,89 C142,88 118,86 108,88Z"
          fill="url(#petalGrad2)"/>
    <path d="M168,64 C155,72 130,82 110,88" stroke="#F5D562" stroke-width="0.5" fill="none" opacity="0.4"/>

    <!-- Petal 3: Bottom-Right -->
    <path d="M103,95 C110,100 130,120 138,134 C146,148 140,164 128,168
             C116,172 104,162 102,148 C100,134 100,106 103,95Z"
          fill="#C89229" opacity="0.85"/>
    <path d="M104,98 C110,102 128,120 135,132 C142,144 138,158 128,162
             C118,166 108,158 106,146 C104,134 103,108 104,98Z"
          fill="url(#petalGrad)"/>
    <path d="M132,158 C124,142 112,118 105,100" stroke="#F5D562" stroke-width="0.5" fill="none" opacity="0.4"/>

    <!-- Petal 4: Bottom-Left -->
    <path d="M97,95 C90,100 70,120 62,134 C54,148 60,164 72,168
             C84,172 96,162 98,148 C100,134 100,106 97,95Z"
          fill="#C89229" opacity="0.85"/>
    <path d="M96,98 C90,102 72,120 65,132 C58,144 62,158 72,162
             C82,166 92,158 94,146 C96,134 97,108 96,98Z"
          fill="url(#petalGrad2)"/>
    <path d="M68,158 C76,142 88,118 95,100" stroke="#F5D562" stroke-width="0.5" fill="none" opacity="0.4"/>

    <!-- Petal 5: Top-Left -->
    <path d="M95,90 C88,82 64,64 52,56 C40,48 26,52 22,66
             C18,80 28,92 42,92 C56,92 84,88 95,90Z"
          fill="#C89229" opacity="0.85"/>
    <path d="M92,88 C86,82 64,66 52,60 C40,54 30,56 26,68
             C22,80 32,90 44,89 C58,88 82,86 92,88Z"
          fill="url(#petalGrad)"/>
    <path d="M32,64 C45,72 70,82 90,88" stroke="#F5D562" stroke-width="0.5" fill="none" opacity="0.4"/>

    <!-- ===== CENTER: Stamen disc ===== -->
    <circle cx="100" cy="92" r="14" fill="url(#centerGrad)"/>
    <circle cx="100" cy="92" r="10" fill="#D43D04" opacity="0.7"/>

    <!-- Stamen filaments — radiating tiny lines with dots -->
    <g stroke="#E85D04" stroke-width="0.7" fill="none" opacity="0.8">
      <line x1="100" y1="78" x2="100" y2="82"/>
      <line x1="107" y1="79" x2="105" y2="83"/>
      <line x1="113" y1="83" x2="109" y2="86"/>
      <line x1="114" y1="90" x2="110" y2="90"/>
      <line x1="113" y1="98" x2="109" y2="96"/>
      <line x1="107" y1="104" x2="105" y2="100"/>
      <line x1="100" y1="106" x2="100" y2="102"/>
      <line x1="93" y1="104" x2="95" y2="100"/>
      <line x1="87" y1="98" x2="91" y2="96"/>
      <line x1="86" y1="90" x2="90" y2="90"/>
      <line x1="87" y1="83" x2="91" y2="86"/>
      <line x1="93" y1="79" x2="95" y2="83"/>
    </g>

    <!-- Stamen tips — gold dots -->
    <g fill="url(#stamenGrad)">
      <circle cx="100" cy="77" r="1.8"/>
      <circle cx="107.5" cy="78.5" r="1.6"/>
      <circle cx="113.5" cy="82.5" r="1.6"/>
      <circle cx="115" cy="90" r="1.8"/>
      <circle cx="113.5" cy="98.5" r="1.6"/>
      <circle cx="107.5" cy="104.5" r="1.6"/>
      <circle cx="100" cy="107" r="1.8"/>
      <circle cx="92.5" cy="104.5" r="1.6"/>
      <circle cx="86.5" cy="98.5" r="1.6"/>
      <circle cx="85" cy="90" r="1.8"/>
      <circle cx="86.5" cy="82.5" r="1.6"/>
      <circle cx="92.5" cy="78.5" r="1.6"/>
    </g>

    <!-- Inner center highlight -->
    <circle cx="99" cy="91" r="4" fill="#E85D04" opacity="0.6"/>
    <circle cx="98.5" cy="90.5" r="2" fill="#F5D562" opacity="0.3"/>
  </g>

  <!-- ======================== VERSION 2: WATERMARK ======================== -->
  <g id="flower-watermark" opacity="0.04" fill="#002B5B">
    <!-- Petal 1: Top -->
    <path d="M100,85 C94,76 84,54 83,40 C82,28 89,16 100,16
             C111,16 118,28 117,40 C116,54 106,76 100,85Z"/>
    <!-- Petal 2: Top-Right -->
    <path d="M108,88 C114,82 136,66 148,60 C160,54 170,56 174,68
             C178,80 168,90 156,89 C142,88 118,86 108,88Z"/>
    <!-- Petal 3: Bottom-Right -->
    <path d="M104,98 C110,102 128,120 135,132 C142,144 138,158 128,162
             C118,166 108,158 106,146 C104,134 103,108 104,98Z"/>
    <!-- Petal 4: Bottom-Left -->
    <path d="M96,98 C90,102 72,120 65,132 C58,144 62,158 72,162
             C82,166 92,158 94,146 C96,134 97,108 96,98Z"/>
    <!-- Petal 5: Top-Left -->
    <path d="M92,88 C86,82 64,66 52,60 C40,54 30,56 26,68
             C22,80 32,90 44,89 C58,88 82,86 92,88Z"/>
    <!-- Center -->
    <circle cx="100" cy="92" r="14"/>
  </g>

  <!-- ======================== VERSION 3: ICON (Simplified) ======================== -->
  <g id="flower-icon" display="none">
    <!-- Simplified smooth 5-petal for small sizes -->
    <!-- Petal 1: Top -->
    <path d="M100,82 C95,72 86,50 86,38 C86,26 92,18 100,18
             C108,18 114,26 114,38 C114,50 105,72 100,82Z"
          fill="#D4AF37"/>
    <!-- Petal 2: Top-Right -->
    <path d="M106,86 C112,80 130,66 142,62 C154,58 162,64 162,74
             C162,84 152,88 142,87 C130,86 114,86 106,86Z"
          fill="#E0C050"/>
    <!-- Petal 3: Bottom-Right -->
    <path d="M104,94 C108,100 122,116 128,128 C134,140 130,150 122,152
             C114,154 108,148 106,138 C104,128 103,104 104,94Z"
          fill="#D4AF37"/>
    <!-- Petal 4: Bottom-Left -->
    <path d="M96,94 C92,100 78,116 72,128 C66,140 70,150 78,152
             C86,154 92,148 94,138 C96,128 97,104 96,94Z"
          fill="#E0C050"/>
    <!-- Petal 5: Top-Left -->
    <path d="M94,86 C88,80 70,66 58,62 C46,58 38,64 38,74
             C38,84 48,88 58,87 C70,86 86,86 94,86Z"
          fill="#D4AF37"/>
    <!-- Center -->
    <circle cx="100" cy="90" r="10" fill="#E85D04"/>
    <circle cx="100" cy="90" r="6" fill="#D43D04"/>
    <!-- Gold stamen ring -->
    <circle cx="100" cy="90" r="12" fill="none" stroke="#F5D562" stroke-width="1.5" stroke-dasharray="2.5 3" opacity="0.7"/>
  </g>
</svg>